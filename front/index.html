<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

  <body onload="obterFilmes()">
    <div class="container mt-5">

      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="d-none alert alert-danger alert-dismissible" role="alert">
            Preencha todos os campos.
            <button type="button" class="btn-close" aria-label="Close"></button>
          </div>
        </div>
      </div>

      <div class="row justify-content-center">
        <div class="com-md-8 col-lg-4">
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="tituloInput" placeholder="Titulo do filme">
              <label for="tituloInput">Titulo do filme</label>
            </div>
        </div>
        <div class="com-md-8 col-lg-4">
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="sinopseInput" placeholder="Sinopse do filme">
              <label for="sinopse">Sinopse do filme</label>
            </div>
        </div>

      </div>


      <div class="row justify-content-center">
        <div class="col-md-8">
            <button class="btn btn-outline-success w-100" onclick="cadastrarFilme()">
              Cadastrar
            </button>
        </div>
      </div>


        <div class="row justify-content-center">
            <div class="col-md-8">
                <table class="table table-striped table-hover text-center filmes">
                    <thead>
                        <tr>
                            <th>Titulo</th>
                            <th>sinopse</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="js/scripts.js"></script>

  </body>
</html>
